<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gentle Day and Night Glass Diamond Clock</title>
<style>
/* Define the clock's night palette and values that JavaScript updates continuously. */
:root{--bg:#08111f;--bg2:#17233c;--face1:#152a45;--face2:#0d1b2e;--text:#f5f9ff;--muted:#91a5bd;--accent:#6ee7ff;--accent2:#a78bfa;--edge:rgba(110,231,255,.8);--water1:rgba(110,231,255,.42);--water2:rgba(167,139,250,.5);--water-level:0%;--edge-progress:0deg}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 18%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 35%),radial-gradient(circle at 82% 78%,color-mix(in srgb,var(--accent2) 16%,transparent),transparent 37%),linear-gradient(145deg,var(--bg),var(--bg2));transition:background 2.8s ease-in-out,color 2.8s ease-in-out}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(255,239,206,.13),transparent 48%);opacity:var(--twilight,0);transition:opacity 2.8s ease-in-out}body:before{content:"";position:fixed;inset:-35%;background:conic-gradient(from 90deg,transparent,color-mix(in srgb,var(--accent) 7%,transparent),transparent,color-mix(in srgb,var(--accent2) 7%,transparent),transparent);animation:drift 18s linear infinite;pointer-events:none}@keyframes drift{to{transform:rotate(360deg)}}
.experience{position:relative;z-index:1;width:min(94vw,760px);text-align:center}.preview{margin:0 0 20px;color:var(--muted);font-size:clamp(.7rem,1.7vw,.87rem);font-weight:750;letter-spacing:.18em;text-transform:uppercase;transition:color 2.8s ease-in-out}
.stage{position:relative;width:min(78vw,555px);aspect-ratio:1;margin:auto;display:grid;place-items:center}
/* Rotate a rounded square to form the main diamond face. */
.diamond-shell{position:absolute;inset:11%;padding:5px;border-radius:20%;transform:rotate(45deg);background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.045) 42%,rgba(255,255,255,.16) 78%,rgba(255,255,255,.035));box-shadow:0 34px 90px rgba(0,0,0,.38),0 0 36px rgba(255,255,255,.08)}
.diamond-gap{width:100%;height:100%;padding:3px;border-radius:18%;background:color-mix(in srgb,var(--bg) 72%,transparent);transition:background 2.8s ease-in-out}
.diamond-face{position:relative;width:100%;height:100%;overflow:hidden;border:0;border-radius:16%;background:linear-gradient(145deg,color-mix(in srgb,var(--face1) 86%,white),var(--face2));box-shadow:inset 18px 18px 42px rgba(255,255,255,.10),inset -22px -24px 48px rgba(4,10,24,.22),0 12px 35px rgba(0,0,0,.18);transition:background 2.8s ease-in-out,border-color 2.8s ease-in-out}
/* Add restrained reflections and delicate droplets to the polished glass surface. */
.diamond-face:before{content:"";position:absolute;z-index:4;inset:5% 8% 45% 12%;border-radius:42% 52% 40% 55%;background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.07) 30%,transparent 58%);filter:blur(2px);opacity:.72;pointer-events:none}
.diamond-face:after{content:"";position:absolute;z-index:6;inset:0;pointer-events:none;background:radial-gradient(ellipse 3px 4px at 27% 29%,rgba(255,255,255,.68) 0 12%,rgba(255,255,255,.20) 22%,rgba(180,225,245,.09) 58%,transparent 72%),radial-gradient(ellipse 2px 3px at 71% 34%,rgba(255,255,255,.58) 0 10%,rgba(255,255,255,.16) 24%,rgba(170,220,245,.07) 56%,transparent 72%),radial-gradient(ellipse 4px 5px at 76% 70%,rgba(255,255,255,.48) 0 9%,rgba(255,255,255,.13) 20%,rgba(160,215,240,.06) 62%,transparent 75%),radial-gradient(ellipse 2px 3px at 39% 77%,rgba(255,255,255,.45) 0 10%,rgba(255,255,255,.11) 24%,transparent 72%),radial-gradient(ellipse 1.5px 2px at 60% 20%,rgba(255,255,255,.42) 0 12%,rgba(255,255,255,.08) 34%,transparent 74%);filter:drop-shadow(0 1px 1px rgba(4,20,35,.10));opacity:.46;animation:dropletDrift 8.5s ease-in-out infinite alternate;transition:opacity .8s ease} .diamond-face.drops-off:after{opacity:0} @keyframes dropletDrift{0%{transform:translateY(-1px);filter:drop-shadow(0 1px 1px rgba(4,20,35,.08))}55%{transform:translateY(1px);filter:drop-shadow(0 2px 1px rgba(4,20,35,.11))}100%{transform:translateY(3px);filter:drop-shadow(0 2px 2px rgba(4,20,35,.09))}}
/* Counter-rotate the inner animated scene so water remains horizontal. */
.upright-scene{position:absolute;inset:-21%;transform:rotate(-45deg);overflow:hidden}
/* Raise the water through each twelve-hour cycle. */
.water{position:absolute;left:0;right:0;bottom:0;height:var(--water-level);background:linear-gradient(145deg,color-mix(in srgb,var(--water2) 88%,#ff9ed8),color-mix(in srgb,var(--water1) 90%,#75f3dc) 56%,rgba(205,250,255,.68));box-shadow:inset 0 18px 35px color-mix(in srgb,var(--accent) 11%,transparent);transition:background 1s linear;will-change:height}
/* Create two overlapping moving wave crests without external assets. */
.wave,.wave:before{position:absolute;content:"";left:-20%;width:140%;height:12px;border-radius:50%;background:color-mix(in srgb,var(--water1) 36%,transparent);filter:blur(3px)}
.wave{top:-5px;animation:waveOne 7.5s ease-in-out infinite alternate}.wave:before{top:3px;left:-8%;height:8px;background:color-mix(in srgb,var(--water2) 22%,transparent);filter:blur(4px);animation:waveTwo 6.8s ease-in-out infinite alternate}
@keyframes waveOne{from{transform:translateX(-1.5%) translateY(1px) rotate(-.25deg)}to{transform:translateX(1.5%) translateY(-2px) rotate(.25deg)}}@keyframes waveTwo{from{transform:translateX(2%) translateY(-1px)}to{transform:translateX(-2%) translateY(2px)}}
/* Add drifting highlights that make the fill feel luminous and fluid. */
.water:after{content:"";position:absolute;inset:4% 10% 10%;border-radius:42%;background:radial-gradient(ellipse at 35% 15%,rgba(255,255,255,.22),transparent 24%),radial-gradient(ellipse at 72% 62%,rgba(255,255,255,.10),transparent 30%);filter:blur(14px);opacity:.75;animation:shimmer 8s ease-in-out infinite alternate}@keyframes shimmer{to{transform:translateX(5%) translateY(-3%);opacity:.6}}
/* Keep the wording integrated directly into the diamond rather than inside a box. */
.content{position:relative;z-index:5;width:68%;text-align:center;text-shadow:0 3px 25px rgba(0,0,0,.38)}.eyebrow{margin-bottom:14px;color:var(--accent);font-size:clamp(.64rem,1.4vw,.8rem);font-weight:800;letter-spacing:.22em;text-transform:uppercase;transition:color 2.8s ease-in-out}.words{min-height:1.4em;display:grid;place-items:center;margin:14px 0 0;color:var(--muted);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:clamp(.72rem,1.7vw,.98rem);font-weight:600;line-height:1.25;letter-spacing:.035em;text-wrap:balance;transition:color 2.8s ease-in-out}.digital{display:block;margin:0;color:var(--text);background:transparent;border:0;font-size:clamp(2.45rem,8vw,5.6rem);font-weight:420;font-variant-numeric:tabular-nums;letter-spacing:.025em;line-height:1;text-shadow:0 5px 30px rgba(0,0,0,.3);transition:color 2.8s ease-in-out}
.periods{display:flex;justify-content:center;gap:22px;margin-top:12px;color:var(--muted);font-size:clamp(.68rem,1.5vw,.81rem)}.periods span{display:inline-flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%}.day-dot{background:#fff4c7;box-shadow:0 0 11px #fff}.night-dot{background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
.format-switch{display:inline-flex;gap:4px;margin:0 0 10px;padding:4px;border:1px solid rgba(255,255,255,.11);border-radius:999px;background:rgba(4,12,25,.12);backdrop-filter:blur(10px)}.format-switch button{padding:6px 11px;font-size:.68rem}.format-switch button.active{background:rgba(255,255,255,.82);color:#163047;border-color:rgba(255,255,255,.9);box-shadow:0 3px 12px rgba(0,0,0,.10)}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}button{appearance:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 13px;color:var(--muted);background:color-mix(in srgb,var(--face2) 75%,transparent);font:inherit;font-size:.73rem;font-weight:700;cursor:pointer;transition:160ms ease}button:hover,button:focus-visible{color:var(--text);border-color:var(--accent);outline:none}button.active{color:#07111e;border-color:var(--accent);background:var(--accent);box-shadow:0 0 16px color-mix(in srgb,var(--accent) 35%,transparent)}
@media(max-width:520px){.stage{width:min(91vw,500px)}.diamond-shell{inset:13%;padding:8px}.content{width:66%}.periods{gap:13px}.controls{margin-top:12px}button{padding:7px 10px}}
.format-below{margin:4px auto 10px}.eyebrow{margin-bottom:16px}
</style>
</head>
<body>
<main class="experience">

<section class="stage" aria-label="Animated diamond water clock">
<div class="diamond-shell" aria-hidden="true"><div class="diamond-gap"><div class="diamond-face" id="diamondFace"><div class="upright-scene"><div class="water"><div class="wave"></div></div></div></div></div></div>
<div class="content"><div class="eyebrow" id="periodLabel">Night</div><div class="digital" id="digitalTime">12:00 AM</div><h1 class="words" id="wordTime">Twelve o’clock</h1></div>
</section>
<div class="format-switch format-below" aria-label="Time format"><button id="format12" class="active" type="button">12H</button><button id="format24" type="button">24H</button></div><div class="controls" aria-label="Animation controls"><button id="playButton" type="button">Pause</button><button class="speed active" type="button" data-duration="60">60 sec day</button><button class="speed" type="button" data-duration="30">30 sec day</button><button class="speed" type="button" data-duration="120">2 min day</button><button id="restartButton" type="button">Restart</button></div>
</main>
<script>
// Store number words for the small conversational time line.
const numberWords=["twelve","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const tensWords=["","","twenty","thirty","forty","fifty"];
let durationSeconds=60;
let playing=true;
let storedMilliseconds=0;
let startedAt=performance.now();
let use24Hour=false;

// Convert a minute value into English words.
function numberToWords(value){if(value<20)return numberWords[value];const tens=Math.floor(value/10);const units=value%10;return units?`${tensWords[tens]}-${numberWords[units]}`:tensWords[tens]}

// Create the small conversational phrase displayed under the numbers.
function timePhrase(hours,minutes){const current=hours%12||12;const next=current%12+1;if(minutes===0)return `${numberWords[current]} o’clock`;if(minutes===15)return `quarter past ${numberWords[current]}`;if(minutes===30)return `half past ${numberWords[current]}`;if(minutes===45)return `quarter to ${numberWords[next]}`;return minutes<30?`${numberToWords(minutes)} past ${numberWords[current]}`:`${numberToWords(60-minutes)} to ${numberWords[next]}`}

// Blend two color arrays for smooth sunrise and sunset transitions.
function mix(first,second,amount){return first.map((value,index)=>Math.round(value+(second[index]-value)*amount))}
function rgb(values){return `rgb(${values.join(",")})`}

// Return a bright daytime palette and the original dark palette at night.
function palette(hour){const night={bg:[8,17,31],bg2:[23,35,60],f1:[21,42,69],f2:[13,27,46],text:[245,249,255],muted:[145,165,189],accent:[110,231,255],accent2:[167,139,250]};const day={bg:[238,247,255],bg2:[255,255,255],f1:[255,255,255],f2:[226,243,255],text:[20,42,63],muted:[77,105,130],accent:[20,174,224],accent2:[122,94,219]};let first=night,second=night,amount=0,label="Night";if(hour>=5&&hour<7){first=night;second=day;amount=(hour-5)/2;label="Sunrise"}else if(hour>=7&&hour<17){first=day;second=day;label="Daylight"}else if(hour>=17&&hour<19){first=day;second=night;amount=(hour-17)/2;label="Sunset"}const result={};for(const key of Object.keys(first))result[key]=mix(first[key],second[key],amount);result.label=label;result.twilight=(hour>=5&&hour<7)?Math.sin((hour-5)/2*Math.PI):(hour>=17&&hour<19?Math.sin((hour-17)/2*Math.PI):0);return result}

// Apply the palette to the clock without adding extra explanatory text.
function applyPalette(colors){const style=document.documentElement.style;style.setProperty("--bg",rgb(colors.bg));style.setProperty("--bg2",rgb(colors.bg2));style.setProperty("--face1",rgb(colors.f1));style.setProperty("--face2",rgb(colors.f2));style.setProperty("--text",rgb(colors.text));style.setProperty("--muted",rgb(colors.muted));style.setProperty("--accent",rgb(colors.accent));style.setProperty("--accent2",rgb(colors.accent2));style.setProperty("--twilight",colors.twilight.toFixed(3));document.getElementById("periodLabel").textContent=colors.label}

// Calculate playback time while supporting pause and resume.
function elapsed(now){return storedMilliseconds+(playing?now-startedAt:0)}

// Animate the compressed day, water level, colors, and time display.
function update(now){const progress=(elapsed(now)/(durationSeconds*1000))%1;const totalSeconds=progress*86400;const hours=Math.floor(totalSeconds/3600);const minutes=Math.floor((totalSeconds%3600)/60);const decimalHour=totalSeconds/3600;const hourCycle=(totalSeconds%43200)/43200;document.documentElement.style.setProperty("--water-level",`${hourCycle*100}%`);const shownHour=use24Hour?String(hours).padStart(2,"0"):String(hours%12||12).padStart(2,"0");const suffix=use24Hour?"":hours<12?" AM":" PM";document.getElementById("digitalTime").textContent=`${shownHour}:${String(minutes).padStart(2,"0")}${suffix}`;document.getElementById("wordTime").textContent=timePhrase(hours,minutes);applyPalette(palette(decimalHour));requestAnimationFrame(update)}

// Pause or resume the animation at its current point.
document.getElementById("playButton").addEventListener("click",event=>{const now=performance.now();if(playing){storedMilliseconds=elapsed(now);playing=false;event.currentTarget.textContent="Play"}else{startedAt=now;playing=true;event.currentTarget.textContent="Pause"}});

// Change the preview speed without jumping to a different time.
document.querySelectorAll(".speed").forEach(button=>button.addEventListener("click",event=>{const now=performance.now();const progress=(elapsed(now)/(durationSeconds*1000))%1;durationSeconds=Number(event.currentTarget.dataset.duration);storedMilliseconds=progress*durationSeconds*1000;startedAt=now;document.querySelectorAll(".speed").forEach(item=>item.classList.remove("active"));event.currentTarget.classList.add("active")}));

// Switch between 12-hour time and 24-hour time.
document.getElementById("format12").addEventListener("click",()=>{use24Hour=false;document.getElementById("format12").classList.add("active");document.getElementById("format24").classList.remove("active")});
document.getElementById("format24").addEventListener("click",()=>{use24Hour=true;document.getElementById("format24").classList.add("active");document.getElementById("format12").classList.remove("active")});

// Restart the animation from midnight.
document.getElementById("restartButton").addEventListener("click",()=>{storedMilliseconds=0;startedAt=performance.now();playing=true;document.getElementById("playButton").textContent="Pause"});
requestAnimationFrame(update);
</script>
</body>
</html>
<style>.diamond-face:after{display:none!important}.preview,.periods{display:none!important}.experience{padding:12px 0}.stage{margin-top:0}.format-row{margin-top:6px}</style>
