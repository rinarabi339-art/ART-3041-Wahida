<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chair Generation Sequence</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #e8f1e7;
      color: #222;
    }
    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 56px 24px 32px;
    }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 4rem); font-weight: 500; }
    header p { margin: 0; color: #666; font-size: 1rem; }
    .grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }
    figure { margin: 0; }
    img {
      width: 100%;
      display: block;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      background: #f1f6f0;
    }
    figcaption { padding: 12px 2px 0; font-size: .95rem; color: #555; }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; gap: 24px; }
      header { padding-top: 36px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Chair Generation Sequence</h1>
    <p>A visual sequence from the first chair concept to the final result.</p>
  </header>

  <main class="grid">
    <figure>
      <img src="images/chair1.jpg" alt="Chair generation 1" loading="lazy" />
      <figcaption>Chair 1</figcaption>
    </figure>
    <figure>
      <img src="images/chair2.jpg" alt="Chair generation 2" loading="lazy" />
      <figcaption>Chair 2</figcaption>
    </figure>
    <figure>
      <img src="images/chair3.jpg" alt="Chair generation 3" loading="lazy" />
      <figcaption>Chair 3</figcaption>
    </figure>
    <figure>
      <img src="images/chair4.jpg" alt="Chair generation 4" loading="lazy" />
      <figcaption>Chair 4</figcaption>
    </figure>
    <figure>
      <img src="images/chair5.jpg" alt="Chair generation 5" loading="lazy" />
      <figcaption>Chair 5</figcaption>
    </figure>
    <figure>
      <img src="images/chair6.jpg" alt="Chair generation 6" loading="lazy" />
      <figcaption>Chair 6</figcaption>
    </figure>
    <figure>
      <img src="images/chair7.jpg" alt="Chair generation 7" loading="lazy" />
      <figcaption>Chair 7</figcaption>
    </figure>
    <figure>
      <img src="images/chair8.jpg" alt="Chair generation 8" loading="lazy" />
      <figcaption>Chair 8</figcaption>
    </figure>
    <figure>
      <img src="images/chair9.jpg" alt="Chair generation 9" loading="lazy" />
      <figcaption>Chair 9</figcaption>
    </figure>
    <figure>
      <img src="images/chair10.jpg" alt="Chair generation 10" loading="lazy" />
      <figcaption>Chair 10</figcaption>
    </figure>
    <figure>
      <img src="images/chair11.jpg" alt="Chair generation 11" loading="lazy" />
      <figcaption>Chair 11</figcaption>
    </figure>
  </main>
</body>
</html>
