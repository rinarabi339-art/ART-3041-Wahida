<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometric Poster Generator</title>
<style>
  @font-face{
    font-family: "InterLocal";
    src: url("./Inter-Italic-VariableFont_opsz,wght.ttf") format("truetype");
    font-style: italic;
    font-weight: 100 900;
  }
  :root{
    --paper:#f4f4f2;
    --ink:#080808;
    --line:#d7d7d2;
    --panel:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:#e9e9e5;
    color:var(--ink);
    font-family:Arial, Helvetica, sans-serif;
  }
  header{
    padding:20px 24px 12px;
    border-bottom:1px solid #cfcfc9;
    background:var(--panel);
  }
  header h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:-.02em;
  }
  header p{
    margin:5px 0 0;
    color:#666;
    font-size:12px;
  }
  .app{
    display:grid;
    grid-template-columns:320px minmax(420px,1fr) 300px;
    min-height:calc(100vh - 77px);
  }
  .panel{
    background:var(--panel);
    padding:18px;
    border-right:1px solid #cfcfc9;
    overflow:auto;
  }
  .panel.right{
    border-right:0;
    border-left:1px solid #cfcfc9;
  }
  .panel h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.12em;
    margin:0 0 14px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin:13px 0 6px;
  }
  input, textarea, select{
    width:100%;
    border:1px solid #c8c8c2;
    background:#fafaf8;
    border-radius:4px;
    padding:9px 10px;
    font:inherit;
    font-size:13px;
    outline:none;
  }
  textarea{resize:vertical; min-height:72px}
  input:focus, textarea:focus, select:focus{border-color:#111}
  input[type="range"]{padding:0}
  .range-row{
    display:grid;
    grid-template-columns:1fr 48px;
    gap:8px;
    align-items:center;
  }
  .range-value{
    border:1px solid #c8c8c2;
    border-radius:4px;
    padding:7px 5px;
    text-align:center;
    font-size:11px;
  }
  .checks{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:8px;
  }
  .check{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    font-weight:400;
    margin:0;
  }
  .check input{width:auto}
  button{
    width:100%;
    border:1px solid #111;
    background:#111;
    color:white;
    padding:10px 12px;
    border-radius:4px;
    font-weight:700;
    cursor:pointer;
    margin-top:9px;
  }
  button.secondary{
    background:white;
    color:#111;
  }
  button:hover{opacity:.88}
  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    background:#deded9;
    overflow:auto;
  }
  .poster-wrap{
    width:min(68vh, 610px);
    max-width:100%;
    aspect-ratio:8.5/11;
    box-shadow:0 18px 55px rgba(0,0,0,.18);
    background:var(--paper);
  }
  #poster{
    width:100%;
    height:100%;
    display:block;
  }
  .swatches{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .swatch{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid #ddd;
    padding:7px;
    border-radius:4px;
    font-size:11px;
  }
  .dot{
    width:22px;height:22px;border-radius:50%;border:1px solid #bbb;
  }
  .tip{
    margin-top:15px;
    padding:11px;
    border:1px solid #ddd;
    background:#fafaf8;
    font-size:11px;
    line-height:1.45;
    color:#555;
  }
  .small{
    color:#777;
    font-size:10px;
    line-height:1.4;
  }
  @media(max-width:1050px){
    .app{grid-template-columns:280px 1fr}
    .panel.right{grid-column:1 / -1; border-left:0; border-top:1px solid #cfcfc9}
  }
  @media(max-width:760px){
    .app{display:block}
    .panel{border-right:0;border-bottom:1px solid #cfcfc9}
    .stage{min-height:70vh}
  }

  .circle-card{
    border:1px solid #d6d6d0;
    background:#fafaf8;
    border-radius:5px;
    padding:9px;
    margin:8px 0;
  }
  .circle-card h3{
    margin:0 0 7px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .mini-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
  }
  .mini-grid label{font-size:10px;margin:2px 0 4px}
  .mini-grid input[type="range"]{width:100%}
  .mini-value{
    font-size:9px;
    color:#666;
    text-align:right;
    margin-top:2px;
  }
  /* Normal page scrolling. The editor can grow without fixing the whole page. */
  html, body { height:auto; }
  body { overflow:auto; }
  .panel.right{
    height:auto;
    overflow:visible;
  }

</style>
</head>
<body>
<header>
  <h1>Geometric Poster Generator</h1>
  <p>Minimalist black-and-white poster maker inspired by the uploaded Beethoven reference.</p>
</header>

<div class="app">
  <aside class="panel">
    <h2>Content</h2>

    <label for="title">Main title</label>
    <input id="title" value="beethoven">

    <label for="meta">Information block</label>
    <textarea id="meta">tonhalle grosser saal
dienstag, den 22. februar 1955,
20.15 uhr
4. extrakonzert
der tonhalle-gesellschaft

leitung  carl schuricht
solist  wolfgang schneiderhan

beethoven  ouverture zu „coriolan“, op. 62
violinkonzert in d-dur, op. 61
siebente sinfonie in a-dur, op. 92

vorverkauf
tonhalle-kasse, hug, jecklin, kuoni
karten zu fr. 3.50 bis 9.50</textarea>

    <label for="footer">Tiny footer</label>
    <input id="footer" value="modernist poster study">

    <label for="seed">Variation seed</label>
    <input id="seed" value="1955">

    <button id="random">Generate variation</button>
    <button id="reset" class="secondary">Reset reference-like layout</button>
  </aside>

  <main class="stage">
    <div class="poster-wrap">
      <svg id="poster" viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Generated geometric poster"></svg>
    </div>
  </main>

  <aside class="panel right">
    <h2>Editor</h2>

    <label>Number of circles / arcs</label>
    <div class="range-row">
      <input id="circleCount" type="range" min="1" max="8" value="4">
      <div class="range-value" id="circleCountv">4</div>
    </div>

    <div id="circleControls"></div>

    <label>Overall rotation</label>
    <div class="range-row">
      <input id="rotation" type="range" min="-35" max="35" value="0">
      <div class="range-value" id="rotationv">0°</div>
    </div>

    <label>Text X position</label>
    <div class="range-row">
      <input id="textx" type="range" min="20" max="650" value="42">
      <div class="range-value" id="textxv">42</div>
    </div>

    <label>Text Y position</label>
    <div class="range-row">
      <input id="texty" type="range" min="80" max="1000" value="690">
      <div class="range-value" id="textyv">690</div>
    </div>

    <label>Title size</label>
    <div class="range-row">
      <input id="titlesize" type="range" min="20" max="90" value="38">
      <div class="range-value" id="titlesizev">38</div>
    </div>

    <label>Body text size</label>
    <div class="range-row">
      <input id="bodysize" type="range" min="6" max="28" value="11.5" step="0.5">
      <div class="range-value" id="bodysizev">11.5</div>
    </div>

    <label>Body line spacing</label>
    <div class="range-row">
      <input id="lineheight" type="range" min="8" max="28" value="15">
      <div class="range-value" id="lineheightv">15</div>
    </div>

    <label>Color palette</label>
    <select id="palette">
      <option value="bw">Black + Off-white</option>
      <option value="cream">Black + Cream</option>
      <option value="navy">Navy + Cream</option>
      <option value="red">Red + Cream</option>
      <option value="green">Forest + Cream</option>
      <option value="purple">Purple + Cream</option>
      <option value="blue">Blue + Pale Gray</option>
      <option value="custom">Custom colors</option>
    </select>

    <div id="customColors" style="display:none">
      <label>Graphic color</label>
      <input id="graphicColor" type="color" value="#080808">
      <label>Background color</label>
      <input id="backgroundColor" type="color" value="#f4f4f2">
      <label>Text color</label>
      <input id="textColor" type="color" value="#080808">
    </div>

    <label>Options</label>
    <div class="checks">
      <label class="check"><input id="thin" type="checkbox" checked> thin outlines</label>
      <label class="check"><input id="double" type="checkbox" checked> repeat outlines</label>
      <label class="check"><input id="invert" type="checkbox"> invert</label>
    </div>

    <button id="random">Generate variation</button>
    <button id="reset" class="secondary">Reset reference-like layout</button>
    <button id="downloadSvg">Download SVG</button>
    <button id="downloadPng" class="secondary">Download PNG</button>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const poster = $("poster");

function seeded(seed){
  let h=0;
  for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
  return ()=>{ h=(1664525*h+1013904223)>>>0; return h/4294967296; };
}

function arcPath(cx,cy,r,startDeg,endDeg){
  const a1=(startDeg-90)*Math.PI/180, a2=(endDeg-90)*Math.PI/180;
  const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
  const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
  const large=Math.abs(endDeg-startDeg)>180?1:0;
  const sweep=endDeg>startDeg?1:0;
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} ${sweep} ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

function rectBand(cx,cy,r1,r2,start,end,fill){
  const a1=(start-90)*Math.PI/180, a2=(end-90)*Math.PI/180;
  const p1=[cx+r2*Math.cos(a1),cy+r2*Math.sin(a1)];
  const p2=[cx+r2*Math.cos(a2),cy+r2*Math.sin(a2)];
  const p3=[cx+r1*Math.cos(a2),cy+r1*Math.sin(a2)];
  const p4=[cx+r1*Math.cos(a1),cy+r1*Math.sin(a1)];
  const large=Math.abs(end-start)>180?1:0;
  const sweep=end>start?1:0;
  return `<path d="M ${p1[0]} ${p1[1]} A ${r2} ${r2} 0 ${large} ${sweep} ${p2[0]} ${p2[1]} L ${p3[0]} ${p3[1]} A ${r1} ${r1} 0 ${large} ${sweep?0:1} ${p4[0]} ${p4[1]} Z" fill="${fill}"/>`;
}

function esc(s){
  return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[m]));
}

function getPalette(){
  const p=$("palette").value;
  const palettes={
    bw:["#080808","#f4f4f2","#080808"],
    cream:["#111111","#efe5cf","#111111"],
    navy:["#0b1f3a","#f1e8d7","#0b1f3a"],
    red:["#9d1c1c","#f3eadc","#111111"],
    green:["#173b2b","#eee8d7","#111111"],
    purple:["#4b2e5d","#f0e8dc","#111111"],
    blue:["#1d4e69","#e8ece8","#102b38"]
  };
  if(p!=="custom") return palettes[p];
  return [$("graphicColor").value,$("backgroundColor").value,$("textColor").value];
}

function render(randomize=false){
  const rng=seeded($("seed").value);
  let rot=+$("rotation").value;
  const tx=+$("textx").value, ty=+$("texty").value;
  const titleSize=+$("titlesize").value, bodySize=+$("bodysize").value;
  const lineHeight=+$("lineheight").value;
  let [graphic,bg,textColor]=getPalette();

  if($("invert").checked){ const t=graphic; graphic=bg; bg=t; }

  if(randomize){
    $("rotation").value=Math.round(-22+rng()*44);
    $("circleCount").value=1+Math.floor(rng()*8);
    buildCircleControls(true,rng);
    rot=+$("rotation").value;
  }

  const title=esc($("title").value);
  const meta=esc($("meta").value).split("\n");
  const footer=esc($("footer").value);

  let g=`<g transform="rotate(${rot} 425 550)">`;
  const count=+$("circleCount").value;
  for(let i=1;i<=count;i++){
    const cx=+$("c"+i+"x").value, cy=+$("c"+i+"y").value;
    const radius=+$("c"+i+"r").value, thick=+$("c"+i+"t").value;
    const start=+$("c"+i+"s").value, end=+$("c"+i+"e").value;
    g+=rectBand(cx,cy,radius,radius+thick,start,end,graphic);
    if($("double").checked){
      g+=`<path d="${arcPath(cx,cy,radius+thick+4,start,end)}" fill="none" stroke="${bg}" stroke-width="${$("thin").checked?2:4}"/>`;
    }
  }
  if($("double").checked){
    g+=`<path d="${arcPath(610,680,510,-60,220)}" fill="none" stroke="${bg}" stroke-width="${$("thin").checked?2:4}"/>`;
  }
  g+="</g>";

  let text=`<g fill="${textColor}" font-family="Arial, Helvetica, sans-serif">`;
  text+=`<text x="${tx}" y="${ty}" font-size="${titleSize}" font-weight="700" letter-spacing="-1.1">${title}</text>`;
  text+=`<g font-size="${bodySize}" font-weight="400">`;
  meta.forEach((line,i)=>{ text+=`<text x="${tx+135}" y="${ty+68+i*lineHeight}">${line||" "}</text>`; });
  text+=`</g>`;
  text+=`<text x="780" y="1010" text-anchor="end" font-size="7" transform="rotate(-90 780 1010)">${footer}</text>`;
  text+="</g>";

  poster.innerHTML=`<rect width="850" height="1100" fill="${bg}"/>${g}${text}`;
}

function buildCircleControls(randomize=false,rng=null){
  const container=$("circleControls"), count=+$("circleCount").value;
  $("circleCountv").textContent=count;
  const old={};
  for(let i=1;i<=8;i++){
    if($("c"+i+"x")) old[i]={x:$("c"+i+"x").value,y:$("c"+i+"y").value,r:$("c"+i+"r").value,t:$("c"+i+"t").value,s:$("c"+i+"s").value,e:$("c"+i+"e").value};
  }
  container.innerHTML="";
  for(let i=1;i<=8;i++){
    const d=document.createElement("div");
    d.className="circle-card"; d.style.display=i<=count?"block":"none";
    let v=old[i]||{
      x:620-(i-1)*8, y:710, r:300-(i-1)*75,
      t:i===1?82:(i===2?70:50),
      s:i===1?-70:(i===2?-15:(i===3?8:20)),
      e:i===1?225:(i===2?205:(i===3?190:165))
    };
    if(randomize && rng){
      v.x=Math.round(440+rng()*290); v.y=Math.round(400+rng()*430);
      v.r=Math.round(130+rng()*360); v.t=Math.round(28+rng()*75);
      v.s=Math.round(-75+rng()*85);
      v.e=Math.min(280,v.s+Math.round(90+rng()*190));
    }
    d.innerHTML=`<h3>Circle / arc ${i}</h3>
      <div class="mini-grid">
        <div><label>X</label><input id="c${i}x" type="range" min="-200" max="1100" value="${v.x}"><div class="mini-value" id="c${i}xv">${v.x}</div></div>
        <div><label>Y</label><input id="c${i}y" type="range" min="-200" max="1300" value="${v.y}"><div class="mini-value" id="c${i}yv">${v.y}</div></div>
        <div><label>Size / radius</label><input id="c${i}r" type="range" min="40" max="650" value="${v.r}"><div class="mini-value" id="c${i}rv">${v.r}</div></div>
        <div><label>Thickness</label><input id="c${i}t" type="range" min="8" max="140" value="${v.t}"><div class="mini-value" id="c${i}tv">${v.t}</div></div>
        <div><label>Start angle</label><input id="c${i}s" type="range" min="-180" max="180" value="${v.s}"><div class="mini-value" id="c${i}sv">${v.s}°</div></div>
        <div><label>End angle</label><input id="c${i}e" type="range" min="-180" max="360" value="${v.e}"><div class="mini-value" id="c${i}ev">${v.e}°</div></div>
      </div>`;
    container.appendChild(d);
  }
  for(let i=1;i<=8;i++) ["x","y","r","t","s","e"].forEach(k=>{
    const el=$("c"+i+k);
    if(el) el.addEventListener("input",()=>{
      $("c"+i+k+"v").textContent=el.value+((k==="s"||k==="e")?"°":"");
      render(false);
    });
  });
}

function sync(){
  ["rotation","textx","texty","titlesize","bodysize","lineheight"].forEach(id=>{
    const v=$(id).value;
    $(id+"v").textContent=id==="rotation"?v+"°":v;
  });
  $("customColors").style.display=$("palette").value==="custom"?"block":"none";
  render(false);
}

["rotation","textx","texty","titlesize","bodysize","lineheight","title","meta","footer","seed","thin","double","invert","palette","graphicColor","backgroundColor","textColor"].forEach(id=>{
  $(id).addEventListener("input",sync);
  $(id).addEventListener("change",sync);
});
$("circleCount").addEventListener("input",()=>{buildCircleControls(false);sync();});
$("random").onclick=()=>render(true);

$("reset").onclick=()=>{
  $("title").value="beethoven";
  $("meta").value=`tonhalle grosser saal
dienstag, den 22. februar 1955,
20.15 uhr
4. extrakonzert
der tonhalle-gesellschaft

leitung  carl schuricht
solist  wolfgang schneiderhan

beethoven  ouverture zu „coriolan“, op. 62
violinkonzert in d-dur, op. 61
siebente sinfonie in a-dur, op. 92

vorverkauf
tonhalle-kasse, hug, jecklin, kuoni
karten zu fr. 3.50 bis 9.50`;
  $("footer").value="modernist poster study";
  $("seed").value="1955";
  $("circleCount").value=4;
  $("rotation").value=0; $("textx").value=42; $("texty").value=690;
  $("titlesize").value=38; $("bodysize").value=11.5; $("lineheight").value=15;
  $("palette").value="bw";
  $("thin").checked=true; $("double").checked=true; $("invert").checked=false;
  buildCircleControls(false); sync();
};

$("downloadSvg").onclick=()=>{
  const blob=new Blob([new XMLSerializer().serializeToString(poster)],{type:"image/svg+xml"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="geometric-poster.svg";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
};

$("downloadPng").onclick=()=>{
  const svg=new XMLSerializer().serializeToString(poster);
  const blob=new Blob([svg],{type:"image/svg+xml"});
  const url=URL.createObjectURL(blob),img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas");c.width=1700;c.height=2200;
    const ctx=c.getContext("2d");ctx.fillStyle="#f4f4f2";ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="geometric-poster.png";a.click();});
  };
  img.src=url;
};

buildCircleControls(false);
sync();
</script>
</body>
</html>
